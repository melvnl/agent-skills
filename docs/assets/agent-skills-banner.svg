<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">melvin-skills: portable engineering capabilities for Claude Code</title>
  <desc id="desc">The engineering lifecycle from define to ship, powered by seven plugins (spec-driven engineering, python backend, observability, application security, fintech engineering, technical writing) on top of deterministic engineering guardrails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="1090" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.08"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="24" fill="url(#grid)" opacity="0.55"/>

  <!-- Title -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="78" fill="#F8FAFC" font-size="44" font-weight="700" letter-spacing="-0.5">melvin-skills</text>
    <text x="60" y="112" fill="#94A3B8" font-size="19">Portable engineering capabilities for Claude Code: spec-driven, observable, guarded.</text>

    <!-- Counts -->
    <g font-size="15" fill="#CBD5E1">
      <g transform="translate(828,54)">
        <rect width="72" height="58" rx="10" fill="#0F172A" stroke="#334155"/>
        <text x="36" y="28" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">41</text>
        <text x="36" y="47" text-anchor="middle" font-size="12">skills</text>
      </g>
      <g transform="translate(910,54)">
        <rect width="72" height="58" rx="10" fill="#0F172A" stroke="#334155"/>
        <text x="36" y="28" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">11</text>
        <text x="36" y="47" text-anchor="middle" font-size="12">agents</text>
      </g>
      <g transform="translate(992,54)">
        <rect width="72" height="58" rx="10" fill="#0F172A" stroke="#334155"/>
        <text x="36" y="28" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">18</text>
        <text x="36" y="47" text-anchor="middle" font-size="12">hooks</text>
      </g>
      <g transform="translate(1074,54)">
        <rect width="72" height="58" rx="10" fill="#0F172A" stroke="#334155"/>
        <text x="36" y="28" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">11</text>
        <text x="36" y="47" text-anchor="middle" font-size="12">workflows</text>
      </g>
    </g>

    <!-- Lifecycle -->
    <path d="M110 190 H1090" stroke="url(#flow)" stroke-width="3" opacity="0.85"/>
    <g font-size="15" font-weight="600" text-anchor="middle">
      <g transform="translate(110,190)">
        <circle r="30" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
        <path d="M-9 -9 h18 M-9 -1 h18 M-9 7 h11" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
        <text y="56" fill="#E2E8F0">Define</text>
        <text y="75" fill="#64748B" font-size="12" font-weight="400">discovery · PRD · specs</text>
      </g>
      <g transform="translate(306,190)">
        <circle r="30" fill="#0F172A" stroke="#60A5FA" stroke-width="2.5"/>
        <path d="M-10 -8 h6 v6 h-6 z M2 -8 h8 M2 -4 h5 M-10 4 h6 v6 h-6 z M2 4 h8 M2 8 h5" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round"/>
        <text y="56" fill="#E2E8F0">Plan</text>
        <text y="75" fill="#64748B" font-size="12" font-weight="400">design · tasks · ADRs</text>
      </g>
      <g transform="translate(502,190)">
        <circle r="30" fill="#0F172A" stroke="#818CF8" stroke-width="2.5"/>
        <path d="M-6 -9 L-13 0 L-6 9 M6 -9 L13 0 L6 9" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="56" fill="#E2E8F0">Build</text>
        <text y="75" fill="#64748B" font-size="12" font-weight="400">loops · TDD · logging</text>
      </g>
      <g transform="translate(698,190)">
        <circle r="30" fill="#0F172A" stroke="#A78BFA" stroke-width="2.5"/>
        <path d="M-10 1 L-3 8 L11 -7" fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text y="56" fill="#E2E8F0">Verify</text>
        <text y="75" fill="#64748B" font-size="12" font-weight="400">QA · traceability</text>
      </g>
      <g transform="translate(894,190)">
        <circle r="30" fill="#0F172A" stroke="#2DD4BF" stroke-width="2.5"/>
        <circle cx="-2" cy="-2" r="8" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
        <path d="M4 4 L11 11" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
        <text y="56" fill="#E2E8F0">Review</text>
        <text y="75" fill="#64748B" font-size="12" font-weight="400">security · obs · fintech</text>
      </g>
      <g transform="translate(1090,190)">
        <circle r="30" fill="#0F172A" stroke="#34D399" stroke-width="2.5"/>
        <path d="M0 -12 C7 -6 7 4 0 10 C-7 4 -7 -6 0 -12 z M-4 10 L-7 15 M4 10 L7 15" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
        <text y="56" fill="#E2E8F0">Ship</text>
        <text y="75" fill="#64748B" font-size="12" font-weight="400">approval · rollback</text>
      </g>
    </g>

    <!-- Human gates -->
    <g font-size="11" fill="#FBBF24" text-anchor="middle">
      <text x="208" y="168">⏸ approve</text>
      <text x="404" y="168">⏸ approve</text>
      <text x="992" y="168">⏸ approve</text>
    </g>

    <!-- Router line -->
    <text x="600" y="306" text-anchor="middle" fill="#94A3B8" font-size="13">routed by the Software Factory (factory-router) · state in files, not memory</text>

    <!-- Plugins -->
    <g font-size="14" font-weight="600" text-anchor="middle">
      <g transform="translate(60,326)">
        <rect width="170" height="64" rx="12" fill="#0B2A3F" stroke="#38BDF8" stroke-opacity="0.6"/>
        <text x="85" y="29" fill="#E0F2FE">spec-driven</text>
        <text x="85" y="47" fill="#E0F2FE">engineering</text>
      </g>
      <g transform="translate(244,326)">
        <rect width="170" height="64" rx="12" fill="#1E1B4B" stroke="#818CF8" stroke-opacity="0.6"/>
        <text x="85" y="38" fill="#E0E7FF">python-backend</text>
      </g>
      <g transform="translate(428,326)">
        <rect width="170" height="64" rx="12" fill="#2E1065" stroke="#A78BFA" stroke-opacity="0.6"/>
        <text x="85" y="38" fill="#EDE9FE">observability</text>
      </g>
      <g transform="translate(612,326)">
        <rect width="170" height="64" rx="12" fill="#3B0D2A" stroke="#F472B6" stroke-opacity="0.6"/>
        <text x="85" y="29" fill="#FCE7F3">application</text>
        <text x="85" y="47" fill="#FCE7F3">security</text>
      </g>
      <g transform="translate(796,326)">
        <rect width="170" height="64" rx="12" fill="#052E2B" stroke="#2DD4BF" stroke-opacity="0.6"/>
        <text x="85" y="29" fill="#CCFBF1">fintech</text>
        <text x="85" y="47" fill="#CCFBF1">engineering</text>
      </g>
      <g transform="translate(980,326)">
        <rect width="160" height="64" rx="12" fill="#052E16" stroke="#34D399" stroke-opacity="0.6"/>
        <text x="80" y="29" fill="#DCFCE7">technical</text>
        <text x="80" y="47" fill="#DCFCE7">writing</text>
      </g>
    </g>

    <!-- Guardrails band -->
    <g transform="translate(60,408)">
      <rect width="1080" height="54" rx="12" fill="url(#guard)" stroke="#F59E0B" stroke-opacity="0.55"/>
      <path d="M30 13 L42 9 L54 13 V25 C54 33 48 38 42 41 C36 38 30 33 30 25 z" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M36 25 L40 29 L48 20" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="33" fill="#FDE68A" font-size="15" font-weight="700">engineering-guardrails</text>
      <text x="262" y="33" fill="#FCD34D" font-size="14">deterministic hooks: secrets · destructive commands · sensitive logging · financial core · migrations</text>
    </g>

    <text x="600" y="494" text-anchor="middle" fill="#64748B" font-size="13">skills = how · agents = who · hooks = what is allowed · workflows = in what order</text>
  </g>
</svg>
